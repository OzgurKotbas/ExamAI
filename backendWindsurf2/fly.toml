app = "backendwindsurf2"
primary_region = "fra"

[build]

[processes]
  app = "uvicorn main:app --host 0.0.0.0 --port 8080"
  worker = "celery -A celery_app worker -Q default,quiz_generation --loglevel=info --pool=solo"

[[services]]
  protocol = "tcp"
  internal_port = 8080
  processes = ["app"]

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]
  
  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
