services:
  api:
    build: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres
    volumes:
      - ./uploads:/app/uploads

  worker:
    build: .
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    volumes:
      - ./uploads:/app/uploads
    command: celery -A celery_app:celery_app worker --loglevel=info

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: examai_user
      POSTGRES_PASSWORD: examai_password
      POSTGRES_DB: examai_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

